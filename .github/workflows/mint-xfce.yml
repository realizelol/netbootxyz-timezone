name: Build Linux Mint XFCE timezone initrd

on:
  workflow_dispatch:

  schedule:
    - cron: "15 4 * * *"

permissions:
  contents: write

env:
  ENDPOINTS_URL: https://raw.githubusercontent.com/netbootxyz/netboot.xyz/development/endpoints.yml


jobs:

  discover:
    name: Find latest Linux Mint XFCE
    runs-on: ubuntu-latest

    outputs:
      endpoint: ${{ steps.find.outputs.endpoint }}
      version: ${{ steps.find.outputs.version }}
      path: ${{ steps.find.outputs.path }}
      source_url: ${{ steps.find.outputs.source_url }}
      release_tag: ${{ steps.find.outputs.release_tag }}
      release_exists: ${{ steps.check.outputs.exists }}

    steps:

      - name: Download endpoints.yml
        run: |
          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            "$ENDPOINTS_URL" \
            --output endpoints.yml

          echo "Downloaded endpoints.yml"
          wc -l endpoints.yml


      - name: Install YAML parser
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml


      - name: Find latest Mint XFCE endpoint
        id: find
        run: |
          python3 <<'PY'
          import os
          import re
          import yaml

          with open("endpoints.yml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          endpoints = data.get("endpoints", {})

          matches = []

          for name, entry in endpoints.items():
              if not isinstance(entry, dict):
                  continue

              if str(entry.get("os", "")).lower() != "mint":
                  continue

              if str(entry.get("flavor", "")).lower() != "xfce":
                  continue

              path = entry.get("path")

              if not path:
                  continue

              files = entry.get("files", [])

              if "initrd" not in files:
                  continue

              version = str(entry.get("version", ""))

              matches.append({
                  "name": name,
                  "version": version,
                  "path": path,
              })

          if not matches:
              raise SystemExit(
                  "ERROR: Kein Linux-Mint-XFCE-Endpoint gefunden."
              )

          def version_key(item):
              numbers = re.findall(r"\d+", item["version"])
              return [int(x) for x in numbers]

          matches.sort(
              key=version_key,
              reverse=True
          )

          selected = matches[0]

          print("Gefundene Mint-XFCE-Endpoints:")

          for item in matches:
              print(
                  "  "
                  + item["name"]
                  + " | Version "
                  + item["version"]
                  + " | "
                  + item["path"]
              )

          print()
          print("Ausgewählt:")
          print(selected)

          path = selected["path"].strip("/")

          marker = "releases/download/"

          if marker not in path:
              raise SystemExit(
                  "Unerwarteter Endpoint-Pfad: "
                  + selected["path"]
              )

          source_release = path.split(
              marker,
              1
          )[1].strip("/")

          source_url = (
              "https://github.com/"
              "netbootxyz/ubuntu-squash/releases/download/"
              + source_release
              + "/initrd"
          )

          build_id = source_release.split("/")[-1]

          release_tag = (
              "mint-xfce-"
              + selected["version"]
              + "-"
              + build_id
          )

          output = os.environ["GITHUB_OUTPUT"]

          with open(output, "a", encoding="utf-8") as f:
              f.write(
                  "endpoint="
                  + selected["name"]
                  + "\n"
              )

              f.write(
                  "version="
                  + selected["version"]
                  + "\n"
              )

              f.write(
                  "path="
                  + selected["path"]
                  + "\n"
              )

              f.write(
                  "source_url="
                  + source_url
                  + "\n"
              )

              f.write(
                  "release_tag="
                  + release_tag
                  + "\n"
              )
          PY


      - name: Show selected source
        run: |
          echo "Endpoint : ${{ steps.find.outputs.endpoint }}"
          echo "Version  : ${{ steps.find.outputs.version }}"
          echo "Path     : ${{ steps.find.outputs.path }}"
          echo "Source   : ${{ steps.find.outputs.source_url }}"
          echo "Release  : ${{ steps.find.outputs.release_tag }}"


      - name: Check whether release exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.find.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              >/dev/null 2>&1
          then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "Release exists
