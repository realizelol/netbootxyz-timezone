name: Build Linux Mint XFCE timezone initrd

on:
  workflow_dispatch:

  schedule:
    # Jeden Tag um 04:15 UTC
    - cron: "15 4 * * *"


permissions:
  contents: write


env:
  ENDPOINTS_URL: https://raw.githubusercontent.com/netbootxyz/netboot.xyz/development/endpoints.yml
  SOURCE_REPO: netbootxyz/ubuntu-squash


jobs:

  discover:
    name: Find latest Linux Mint XFCE
    runs-on: ubuntu-latest

    outputs:
      endpoint: ${{ steps.discover.outputs.endpoint }}
      version: ${{ steps.discover.outputs.version }}
      path: ${{ steps.discover.outputs.path }}
      source_url: ${{ steps.discover.outputs.source_url }}
      release_tag: ${{ steps.discover.outputs.release_tag }}

    steps:

      - name: Checkout
        uses: actions/checkout@v6


      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml


      - name: Download endpoints.yml
        run: |
          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            "$ENDPOINTS_URL" \
            -o endpoints.yml

          echo "Downloaded endpoints.yml:"
          wc -l endpoints.yml


      - name: Find latest Mint XFCE endpoint
        id: discover
        run: |

          python3 <<'PY'

          import os
          import yaml
          import re

          with open("endpoints.yml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          endpoints = data.get("endpoints", {})

          matches = []

          for name, entry in endpoints.items():

              if not isinstance(entry, dict):
                  continue

              if str(entry.get("os", "")).lower() != "mint":
                  continue

              if str(entry.get("flavor", "")).lower() != "xfce":
                  continue

              path = entry.get("path")

              if not path:
                  continue

              files = entry.get("files", [])

              if "initrd" not in files:
                  continue

              version = str(entry.get("version", ""))

              matches.append({
                  "name": name,
                  "version": version,
                  "path": path,
                  "files": files,
              })


          if not matches:
              raise SystemExit(
                  "ERROR: No Linux Mint XFCE endpoint found."
              )


          def version_key(item):

              value = item["version"]

              parts = []

              for part in re.split(r'[^0-9]+', value):

                  if part:
                      parts.append(int(part))

              return parts


          matches.sort(key=version_key, reverse=True)

          selected = matches[0]

          print("Found Mint XFCE endpoints:")

          for item in matches:
              print(
                  f"  {item['name']} "
                  f"version={item['version']} "
                  f"path={item['path']}"
              )

          print()
          print("Selected:")
          print(selected)


          name = selected["name"]
          version = selected["version"]
          path = selected["path"]


          # Remove leading/trailing slashes.
          path_clean = path.strip("/")

          # Extract ubuntu-squash release identifier.
          #
          # Example:
          #
          # /ubuntu-squash/releases/download/22-8770cb66/
          #
          # -> 22-8770cb66

          marker = "releases/download/"

          if marker not in path_clean:
              raise SystemExit(
                  f"Unexpected endpoint path: {path}"
              )

          source_release = path_clean.split(marker, 1)[1].strip("/")


          source_url = (
              "https://github.com/"
              + "netbootxyz/ubuntu-squash/releases/download/"
              + source_release
              + "/initrd"
          )


          # Unique identifier for our patched release.
          release_tag = (
              "mint-xfce-"
              + version
              + "-"
              + source_release.split("/")[-1]
          )


          output = os.environ["GITHUB_OUTPUT"]

          with open(output, "a", encoding="utf-8") as f:

              f.write(f"endpoint={name}\n")
              f.write(f"version={version}\n")
              f.write(f"path={path}\n")
              f.write(f"source_url={source_url}\n")
              f.write(f"release_tag={release_tag}\n")

          PY


      - name: Show selected source
        run: |
          echo "Endpoint : ${{ steps.discover.outputs.endpoint }}"
          echo "Version  : ${{ steps.discover.outputs.version }}"
          echo "Path     : ${{ steps.discover.outputs.path }}"
          echo "Source   : ${{ steps.discover.outputs.source_url }}"
          echo "Release  : ${{ steps.discover.outputs.release_tag }}"


  patch:
    name: Patch initrd
    needs: discover
    runs-on: ubuntu-latest

    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version: ${{ steps.meta.outputs.version }}

    steps:

      - name: Checkout
        uses: actions/checkout@v6


      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            cpio \
            zstd \
            initramfs-tools \
            file


      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.discover.outputs.release_tag }}
        run: |

          if gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              >/dev/null 2>&1
          then

              echo "already=true" >> "$GITHUB_OUTPUT"

              echo
              echo "Release already exists:"
              echo "$RELEASE_TAG"

          else

              echo "already=false" >> "$GITHUB_OUTPUT"

              echo
              echo "Release does not exist yet."

          fi


      - name: Stop because release already exists
        if: steps.existing.outputs.already == 'true'
        run: |
          echo "Nothing to do."
          exit 0


      - name: Download original initrd
        if: steps.existing.outputs.already == 'false'
        env:
          SOURCE_URL: ${{ needs.discover.outputs.source_url }}
        run: |

          echo "Downloading:"
          echo "$SOURCE_URL"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --output initrd \
            "$SOURCE_URL"

          echo
          ls -lh initrd
          file initrd


      - name: Make patcher executable
        if: steps.existing.outputs.already == 'false'
        run: |
          chmod +x scripts/patch-initrd.sh


      - name: Patch initrd
        if: steps.existing.outputs.already == 'false'
        run: |

          ./scripts/patch-initrd.sh \
            initrd \
            initrd.timezone


      - name: Create metadata
        if: steps.existing.outputs.already == 'false'
        env:
          ENDPOINT: ${{ needs.discover.outputs.endpoint }}
          VERSION: ${{ needs.discover.outputs.version }}
          PATH_VALUE: ${{ needs.discover.outputs.path }}
          SOURCE_URL: ${{ needs.discover.outputs.source_url }}
          RELEASE_TAG: ${{ needs.discover.outputs.release_tag }}
        run: |

          sha256sum initrd.timezone > SHA256SUMS


          cat > SOURCE.txt <<EOF
          Linux Mint XFCE timezone-patched initrd

          Distribution: Linux Mint
          Flavor: XFCE
          Architecture: amd64

          netboot.xyz endpoint:
          ${ENDPOINT}

          Mint version:
          ${VERSION}

          ubuntu-squash path:
          ${PATH_VALUE}

          Original initrd:
          ${SOURCE_URL}

          Patched release:
          ${RELEASE_TAG}

          Patch:
          patches/23timezone

          Kernel parameter:
          mint_tz=Europe/Berlin
          EOF


          echo
          echo "SOURCE.txt:"
          cat SOURCE.txt

          echo
          echo "SHA256SUMS:"
          cat SHA256SUMS


      - name: Upload artifact
        if: steps.existing.outputs.already == 'false'
        uses: actions/upload-artifact@v6
        with:
          name: initrd-timezone
          path: |
            initrd.timezone
            SHA256SUMS
            SOURCE.txt


      - name: Set metadata outputs
        id: meta
        run: |
          echo "release_tag=${{ needs.discover.outputs.release_tag }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ needs.discover.outputs.version }}" >> "$GITHUB_OUTPUT"


  release:
    name: Create GitHub Release
    needs: [discover, patch]
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6


      - name: Download patched artifact
        uses: actions/download-artifact@v7
        with:
          name: initrd-timezone
          path: release-assets


      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.discover.outputs.release_tag }}
          VERSION: ${{ needs.discover.outputs.version }}
        run: |

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Linux Mint XFCE ${VERSION} – timezone patched" \
            --generate-notes \
            release-assets/initrd.timezone \
            release-assets/SHA256SUMS \
            release-assets/SOURCE.txt
