name: Linux Mint XFCE timezone initrd

on:
  workflow_dispatch:

  schedule:
    - cron: "15 4 * * *"

permissions:
  contents: write

jobs:

  discover:
    name: Find latest Linux Mint XFCE
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.find.outputs.version }}
      source_url: ${{ steps.find.outputs.source_url }}
      release_tag: ${{ steps.find.outputs.release_tag }}
      exists: ${{ steps.check.outputs.exists }}

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Python YAML
        run: pip3 install pyyaml

      - name: Download endpoints.yml
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/netbootxyz/netboot.xyz/development/endpoints.yml \
            -o endpoints.yml

      - name: Find latest Mint XFCE
        id: find
        run: python3 scripts/find-mint-xfce.py

      - name: Check release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.find.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release already exists: $RELEASE_TAG"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release does not exist: $RELEASE_TAG"
          fi


  patch:
    name: Patch initrd
    needs: discover

    if: needs.discover.outputs.exists == 'false'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio zstd file

      - name: Download initrd
        env:
          SOURCE_URL: ${{ needs.discover.outputs.source_url }}
        run: |
          curl -fsSL \
            --retry 5 \
            "$SOURCE_URL" \
            -o initrd

          file initrd
          ls -lh initrd

      - name: Make patcher executable
        run: chmod +x scripts/patch-initrd.sh

      - name: Patch initrd
        run: |
          ./scripts/patch-initrd.sh initrd initrd.timezone

      - name: Verify initrd
        run: |
          test -s initrd.timezone
          file initrd.timezone
          ls -lh initrd.timezone

      - name: Create checksum
        run: sha256sum initrd.timezone > SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: initrd-timezone
          compression-level: 0
          if-no-files-found: error
          path: |
            initrd.timezone
            SHA256SUMS


  release:
    name: Create GitHub Release
    needs:
      - discover
      - patch

    if: needs.discover.outputs.exists == 'false'

    runs-on: ubuntu-latest

    steps:

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: initrd-timezone
          path: release-assets

      - name: Show files
        run: |
          find release-assets -type f -exec ls -lh {} \;

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.discover.outputs.release_tag }}
          VERSION: ${{ needs.discover.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Linux Mint XFCE ${VERSION} - timezone patched" \
            --generate-notes \
            release-assets/initrd.timezone \
            release-assets/SHA256SUMS
