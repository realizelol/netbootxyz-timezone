name: Live timezone initrd

on:
  workflow_dispatch:

  schedule:
    - cron: "15 4 * * *"

permissions:
  contents: write

jobs:

  # ==========================================================
  # DISCOVER
  # ==========================================================

  discover:
    name: Find live images
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.find.outputs.matrix }}

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Python YAML
        run: |
          pip3 install pyyaml

      - name: Download endpoints.yml
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/netbootxyz/netboot.xyz/development/endpoints.yml \
            -o endpoints.yml

      - name: Find configured targets
        id: find
        run: |
          python3 scripts/discover.py

  # ==========================================================
  # PATCH
  # ==========================================================

  patch:
    name: Patch ${{ matrix.os }} ${{ matrix.flavor }}

    needs:
      - discover

    strategy:
      fail-fast: false

      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      # ------------------------------------------------------
      # Abhängigkeiten
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            cpio \
            zstd \
            file

      # ------------------------------------------------------
      # Initrd herunterladen
      # ------------------------------------------------------

      - name: Download initrd
        env:
          SOURCE_URL: ${{ matrix.source_url }}

        run: |

          echo "============================================================"
          echo "Download"
          echo "============================================================"

          echo "OS      : ${{ matrix.os }}"
          echo "Flavor  : ${{ matrix.flavor }}"
          echo "Version : ${{ matrix.version }}"
          echo "Source  : $SOURCE_URL"

          echo

          curl -fsSL \
            --retry 5 \
            --retry-delay 3 \
            "$SOURCE_URL" \
            -o initrd

          echo

          file initrd

          ls -lh initrd

      # ------------------------------------------------------
      # Patcher ausführbar machen
      # ------------------------------------------------------

      - name: Make patcher executable
        run: |
          chmod +x scripts/patch-initrd.sh

      # ------------------------------------------------------
      # Initrd patchen
      # ------------------------------------------------------

      - name: Patch initrd
        run: |

          ./scripts/patch-initrd.sh \
            initrd \
            initrd.timezone

      # ------------------------------------------------------
      # Ergebnis prüfen
      # ------------------------------------------------------

      - name: Verify initrd
        run: |

          test -s initrd.timezone

          echo
          echo "Patched initrd:"
          echo

          file initrd.timezone

          ls -lh initrd.timezone

      # ------------------------------------------------------
      # SHA256
      # ------------------------------------------------------

      - name: Create checksum
        run: |

          sha256sum \
            initrd.timezone \
            > SHA256SUMS

          cat SHA256SUMS

      # ------------------------------------------------------
      # Artifact
      # ------------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-artifact@v6

        with:
          name: initrd-timezone-${{ matrix.os }}-${{ matrix.flavor }}

          compression-level: 0

          if-no-files-found: error

          path: |
            initrd.timezone
            SHA256SUMS

  # ==========================================================
  # RELEASE
  # ==========================================================

  release:
    name: Create release ${{ matrix.os }} ${{ matrix.flavor }}

    needs:
      - discover
      - patch

    strategy:
      fail-fast: false

      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Artifact herunterladen
      # ------------------------------------------------------

      - name: Download artifact
        uses: actions/download-artifact@v7

        with:
          name: initrd-timezone-${{ matrix.os }}-${{ matrix.flavor }}

          path: release-assets

      # ------------------------------------------------------
      # Dateien anzeigen
      # ------------------------------------------------------

      - name: Show files
        run: |

          echo "Release assets:"

          find release-assets \
            -type f \
            -exec ls -lh {} \;

      # ------------------------------------------------------
      # Prüfen, ob Release bereits existiert
      # ------------------------------------------------------

      - name: Check release
        id: check

        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ matrix.release_tag }}

        run: |

          if gh release view \
              "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              >/dev/null 2>&1
          then

              echo "exists=true" >> "$GITHUB_OUTPUT"

              echo
              echo "Release already exists:"
              echo "$RELEASE_TAG"

          else

              echo "exists=false" >> "$GITHUB_OUTPUT"

              echo
              echo "Release does not exist:"
              echo "$RELEASE_TAG"

          fi

      # ------------------------------------------------------
      # Release erstellen
      # ------------------------------------------------------

      - name: Create release
        if: steps.check.outputs.exists == 'false'

        env:
          GH_TOKEN: ${{ github.token }}

          RELEASE_TAG: ${{ matrix.release_tag }}

          VERSION: ${{ matrix.version }}

          OS: ${{ matrix.os }}

          FLAVOR: ${{ matrix.flavor }}

        run: |

          echo
          echo "Creating release:"
          echo "$RELEASE_TAG"
          echo

          gh release create \
            "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${OS} ${FLAVOR} ${VERSION} - timezone patched" \
            --generate-notes \
            release-assets/initrd.timezone \
            release-assets/SHA256SUMS
